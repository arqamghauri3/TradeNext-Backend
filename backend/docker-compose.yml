services: 
  db:
    container_name: postgres_tradenext_db
    image: postgres:latest
    environment:
      POSTGRES_DB: tradenext
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      PGDATA: /data/postgres
    ports:
      - 5332:5432
    networks:
      - db
    volumes:
      - db:/data/postgres
    restart: unless-stopped
networks:
  db:
    driver: bridge
volumes:
  db: